<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>中国音乐剧小卡抽卡机</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* 卡背淡出 */
@keyframes backFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
.back-fade-out {
  animation: backFadeOut 0.5s ease forwards;
}

/* 正面小卡弹出 */
@keyframes cardPop {
  0% {
    opacity: 0;
    transform: scale(0.7);
  }
  60% {
    opacity: 1;
    transform: scale(1.05);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
.card-pop {
  animation: cardPop 0.45s ease forwards;
}

/* 名称淡入 */
@keyframes nameFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.name-fade {
  animation: nameFade 0.35s ease forwards;
}

/* 撕拉片卡背：左上到右下淡出 */
@keyframes tearBackFade {
  0% {
    opacity: 1;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  100% {
    opacity: 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
}
.tear-back-fade {
  animation: tearBackFade 0.8s ease forwards;
}

/* 撕拉片正面淡入 */
@keyframes tearFrontIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.tear-front-in {
  animation: tearFrontIn 0.4s ease forwards;
  animation-delay: 0.8s;
}

.tab-content { display: none; }
.tab-content.active { display: block; }
.card-item { transition: all 0.3s; }

/* 固定结果区尺寸，避免遮挡按钮 */
.draw-result-box {
  min-height: 380px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  padding: 8px 0;
}

.tear-result-box {
  min-height: 400px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 10px;
}

/* 卡片容器：图片在上，名字在下方独立区域 */
.card-slot {
  width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card-img-wrap {
  width: 160px;
  height: 240px;
  position: relative;
}
.card-name {
  margin-top: 78px;
  text-align: center;
  font-size: 0.875rem;
  opacity: 0;
}

.tear-slot {
  width: 192px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.tear-img-wrap {
  width: 192px;
  height: 288px;
  position: relative;
}
.tear-name {
  margin-top: 8px;
  text-align: center;
  font-size: 0.875rem;
  opacity: 0;
}
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl md:text-3xl font-bold text-center mb-6">小卡抽卡模拟器</h1>

  <!-- 导航标签 -->
  <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-700 pb-2">
    <button class="tab-btn px-4 py-2 rounded bg-sky-600" data-tab="draw">抽卡</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="tear">抽撕拉片</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="book">图鉴</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="log">记录</button>
  </div>

  <!-- 板块1：抽卡 -->
  <div id="draw" class="tab-content active">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽卡</h2>
      <p class="text-slate-400 mb-4">请抽取你的小卡</p>
      <div class="flex gap-3 mb-4">
        <button id="drawBtn" class="px-6 py-2 bg-pink-500 rounded-lg hover:bg-pink-600">单抽一张</button>
        <button id="draw5Btn" class="px-6 py-2 bg-rose-600 rounded-lg hover:bg-rose-700">5连抽</button>
      </div>
      <div id="drawResult" class="draw-result-box">
        <div class="text-slate-500 text-sm self-center">点击按钮开始抽卡</div>
      </div>
    </div>
  </div>

  <!-- 板块2：抽撕拉片 -->
  <div id="tear" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽撕拉片</h2>
      <p class="text-slate-400 mb-4">请抽取你的撕拉片</p>
      <button id="tearBtn" class="px-6 py-2 bg-amber-500 rounded-lg hover:bg-amber-600">抽取一张撕拉片</button>
      <div id="tearResult" class="tear-result-box">
        <div class="text-slate-500 text-sm self-center">点击按钮开始抽取撕拉片</div>
      </div>
    </div>
  </div>

  <!-- 板块3：图鉴 -->
  <div id="book" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">图鉴</h2>
      <p class="text-slate-400 mb-4">已抽到显示正面，未抽到显示卡背</p>
      <div class="mb-4">
        <h3 class="text-lg text-pink-400">普通小卡</h3>
        <div id="cardBook" class="grid grid-cols-3 md:grid-cols-5 gap-4 mt-2"></div>
      </div>
      <div class="mt-6">
        <h3 class="text-lg text-amber-400">撕拉片</h3>
        <div id="tearBook" class="grid grid-cols-3 md:grid-cols-5 gap-4 mt-2"></div>
      </div>
    </div>
  </div>

  <!-- 板块4：记录 -->
  <div id="log" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽取记录</h2>
      <button id="clearLog" class="px-4 py-1 bg-red-500 rounded text-sm mb-4">清空记录</button>
      <div id="logList" class="space-y-2 max-h-[600px] overflow-y-auto pr-2 text-sm">
        <div class="text-slate-400">暂无记录</div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 配置区：在这里替换你的图片 ==========
const cardBackUrl = "https://picsum.photos/id/20/200/300";
const cardList = [
  {id:"c1", name:"小卡A", img:"https://picsum.photos/id/101/200/300"},
  {id:"c2", name:"小卡B", img:"https://picsum.photos/id/102/200/300"},
  {id:"c3", name:"小卡C", img:"https://picsum.photos/id/103/200/300"},
  {id:"c4", name:"小卡D", img:"https://picsum.photos/id/104/200/300"},
];
const polaroidList = [
  {id:"p1", name:"撕拉A", img:"https://picsum.photos/id/111/200/300"},
  {id:"p2", name:"撕拉B", img:"https://picsum.photos/id/112/200/300"},
  {id:"p3", name:"撕拉C", img:"https://picsum.photos/id/113/200/300"},
];

let gotCards = new Set();
let gotTears = new Set();
let logArr = [];

// 标签切换
const tabBtns = document.querySelectorAll(".tab-btn");
const tabs = document.querySelectorAll(".tab-content");
tabBtns.forEach(btn=>{
  btn.onclick = ()=>{
    const target = btn.dataset.tab;
    tabBtns.forEach(b=>b.className="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600");
    btn.className="tab-btn px-4 py-2 rounded bg-sky-600";
    tabs.forEach(t=>t.classList.remove("active"));
    document.getElementById(target).classList.add("active");
    if(target==="book") renderBook();
    if(target==="log") renderLog();
  }
})

// 工具函数
function drawOneCard(){
  return cardList[Math.floor(Math.random()*cardList.length)];
}

// 普通抽卡：单抽
const drawBtn = document.getElementById("drawBtn");
const drawResult = document.getElementById("drawResult");

drawBtn.onclick = ()=>{
  const rand = drawOneCard();
  gotCards.add(rand.id);
  addLog("普通抽卡【单抽】", rand.name);

  drawResult.innerHTML = `
    <div class="card-slot">
      <div class="card-img-wrap">
        <div class="card-back absolute inset-0">
          <img src="${cardBackUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="card-front absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none">
          <img src="${rand.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="card-name">${rand.name}</p>
    </div>
  `;

  const back = drawResult.querySelector(".card-back");
  const front = drawResult.querySelector(".card-front");
  const name = drawResult.querySelector(".card-name");

  setTimeout(() => back.classList.add("back-fade-out"), 100);

  setTimeout(() => {
    back.style.display = "none";
    front.classList.remove("opacity-0", "pointer-events-none");
    front.classList.add("card-pop");
  }, 600);

  setTimeout(() => {
    name.classList.add("name-fade");
  }, 1050);
}

// 普通抽卡：5连抽
const draw5Btn = document.getElementById("draw5Btn");

draw5Btn.onclick = ()=>{
  const resultCards = [];
  for(let i = 0; i < 5; i++){
    const c = drawOneCard();
    resultCards.push(c);
    gotCards.add(c.id);
  }
  addLog("普通抽卡【5连抽】", resultCards.map(x=>x.name).join("、"));

  drawResult.innerHTML = "";

  resultCards.forEach((card, idx) => {
    const slot = document.createElement("div");
    slot.className = "card-slot";
    slot.innerHTML = `
      <div class="card-img-wrap">
        <div class="card-back absolute inset-0">
          <img src="${cardBackUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="card-front absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none">
          <img src="${card.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="card-name">${card.name}</p>
    `;
    drawResult.appendChild(slot);

    const back = slot.querySelector(".card-back");
    const front = slot.querySelector(".card-front");
    const name = slot.querySelector(".card-name");

    const delay = idx * 180;

    setTimeout(() => back.classList.add("back-fade-out"), 100 + delay);

    setTimeout(() => {
      back.style.display = "none";
      front.classList.remove("opacity-0", "pointer-events-none");
      front.classList.add("card-pop");
    }, 600 + delay);

    setTimeout(() => {
      name.classList.add("name-fade");
    }, 1050 + delay);
  });
}

// 撕拉片抽卡
const tearBtn = document.getElementById("tearBtn");
const tearResult = document.getElementById("tearResult");

tearBtn.onclick = ()=>{
  const rand = polaroidList[Math.floor(Math.random()*polaroidList.length)];
  gotTears.add(rand.id);
  addLog("撕拉片抽卡", rand.name);

  tearResult.innerHTML = `
    <div class="tear-slot">
      <div class="tear-img-wrap">
        <div class="tear-back absolute inset-0">
          <img src="${cardBackUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="tear-front absolute inset-0 flex flex-col items-center justify-center opacity-0">
          <img src="${rand.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="tear-name">${rand.name}</p>
    </div>
  `;

  const back = tearResult.querySelector(".tear-back");
  const front = tearResult.querySelector(".tear-front");
  const name = tearResult.querySelector(".tear-name");

  setTimeout(() => back.classList.add("tear-back-fade"), 100);

  setTimeout(() => {
    back.style.display = "none";
    front.classList.remove("opacity-0");
    front.classList.add("tear-front-in");
  }, 800);

  setTimeout(() => {
    name.classList.add("name-fade");
  }, 1200);
}

// 图鉴
function renderBook(){
  const cardBookDom = document.getElementById("cardBook");
  cardBookDom.innerHTML = "";
  cardList.forEach(card=>{
    const have = gotCards.has(card.id);
    const src = have ? card.img : cardBackUrl;
    cardBookDom.innerHTML += `
      <div class="card-item text-center">
        <img src="${src}" class="w-full rounded">
        <p class="text-xs mt-1">${have ? card.name : "???"}</p>
      </div>
    `
  })
  const tearBookDom = document.getElementById("tearBook");
  tearBookDom.innerHTML = "";
  polaroidList.forEach(card=>{
    const have = gotTears.has(card.id);
    const src = have ? card.img : cardBackUrl;
    tearBookDom.innerHTML += `
      <div class="card-item text-center">
        <img src="${src}" class="w-full rounded">
        <p class="text-xs mt-1">${have ? card.name : "???"}</p>
      </div>
    `
  })
}

// 记录
function addLog(type, name){
  const time = new Date().toLocaleString();
  logArr.unshift({time, type, name});
  renderLog();
}
function renderLog(){
  const logDom = document.getElementById("logList");
  if(logArr.length === 0){
    logDom.innerHTML = `<div class="text-slate-400">暂无记录</div>`;
    return;
  }
  logDom.innerHTML = logArr.map(item=>`
    <div class="bg-slate-700 p-2 rounded">
      <span class="text-slate-400">${item.time}</span>
      <span class="mx-2">｜</span>
      <span>${item.type}</span>
      <span class="mx-2">→</span>
      <span class="text-pink-300">${item.name}</span>
    </div>
  `).join("");
}
document.getElementById("clearLog").onclick = ()=>{
  logArr = [];
  renderLog();
}
</script>
</body>
</html>
