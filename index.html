<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>中国音乐剧小卡抽卡模拟器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* 卡背淡出动画 */
@keyframes backFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
.back-fade-out {
  animation: backFadeOut 0.5s ease forwards;
}

/* 正面小卡弹出 */
@keyframes cardPop {
  0% {
    opacity: 0;
    transform: scale(0.7);
  }
  60% {
    opacity: 1;
    transform: scale(1.05);
  }	
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
.card-pop {
  animation: cardPop 0.45s ease forwards;
}

/* 名称淡入 */
@keyframes nameFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.name-fade {
  animation: nameFade 0.35s ease forwards;
}

/* 撕拉片卡背：左上到右下扫开消失 */
@keyframes tearBackFade {
  0% {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  100% {
    clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  }
}
.tear-back-fade {
  animation: tearBackFade 0.8s ease forwards;
}

/* 撕拉片正面淡入 */
@keyframes tearFrontIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.tear-front-in {
  animation: tearFrontIn 0.4s ease forwards;
  animation-delay: 0.8s;
}

.tab-content { display: none; }
.tab-content.active { display: block; }
.card-item { transition: all 0.3s; }

/* 抽卡结果区 */
.draw-result-box {
  min-height: 380px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  padding: 8px 0;
}

.tear-result-box {
  min-height: 400px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  padding: 8px 0;
}

/* 抽卡单张卡片容器 */
.card-slot {
  width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card-img-wrap {
  width: 160px;
  height: 240px;
  position: relative;
}
.card-name {
  margin-top: 8px;
  text-align: center;
  font-size: 0.875rem;
  opacity: 0;
}

.tear-slot {
  width: 192px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.tear-img-wrap {
  width: 192px;
  height: 288px;
  position: relative;
  overflow:hidden;
}
.tear-name {
  margin-top: 8px;
  text-align: center;
  font-size: 0.875rem;
  opacity: 0;
}

/* 图鉴分组样式 */
.series-group{
  margin-bottom:24px;
  width:100%;
}
.series-title{
  color:#f472b6;
  font-weight:bold;
  margin:0 0 6px;
  font-size:1rem;
}
.series-title-tear{
  color:#fbbf24;
}
/* 进度条容器 */
.progress-wrap{
  width:100%;
  height:10px;
  background-color:#334155;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress-bar{
  height:100%;
  background-color:#f472b6;
  transition: width 0.3s ease;
}
.progress-text{
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:8px;
}
.series-card-grid{
  display:grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap:12px;
  width:100%;
}
/* 小于768px手机：一行3张 */
@media (max-width:768px){
  .series-card-grid{
    grid-template-columns: repeat(3, minmax(0,1fr));
  }
}
/* 图鉴卡片容器 + 65%黑色遮罩 */
.book-card-wrap{
  position:relative;
  width:100%;
}
.book-card-wrap img{
  width:100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border-radius:0.5rem;
  display:block;
}
.mask-65{
  position:absolute;
  inset:0;
  background-color:rgba(0,0,0,0.65);
  border-radius:0.5rem;
}
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl md:text-3xl font-bold text-center mb-6">小卡抽卡模拟器</h1>

  <!-- 导航标签 -->
  <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-700 pb-2">
    <button class="tab-btn px-4 py-2 rounded bg-sky-600" data-tab="draw">抽卡</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="tear">抽撕拉片</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="book">图鉴</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="log">记录</button>
    <button id="resetSaveBtn" class="px-4 py-2 rounded bg-red-700 hover:bg-red-600">重置存档</button>
  </div>

  <!-- 板块1：抽卡 -->
  <div id="draw" class="tab-content active">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽卡</h2>
      <p class="text-slate-400 mb-4">请抽取你的小卡</p>
      <div class="flex gap-3 mb-4">
        <button id="drawBtn" class="px-6 py-2 bg-pink-500 rounded-lg hover:bg-pink-600">单抽一张</button>
        <button id="draw5Btn" class="px-6 py-2 bg-rose-600 rounded-lg hover:bg-rose-700">5连抽</button>
      </div>
      <div id="drawResult" class="draw-result-box">
        <div class="text-slate-500 text-sm self-center">点击按钮开始抽卡</div>
      </div>
    </div>
  </div>

  <!-- 板块2：抽撕拉片 -->
  <div id="tear" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽撕拉片</h2>
      <p class="text-slate-400 mb-4">请抽取你的撕拉片</p>
      <div class="flex gap-3 mb-4">
        <button id="tearBtn" class="px-6 py-2 bg-amber-500 rounded-lg hover:bg-amber-600">单抽一张</button>
        <button id="tear5Btn" class="px-6 py-2 bg-orange-600 rounded-lg hover:bg-orange-700">5连抽</button>
      </div>
      <div id="tearResult" class="tear-result-box">
        <div class="text-slate-500 text-sm self-center">点击按钮开始抽取撕拉片</div>
      </div>
    </div>
  </div>

  <!-- 板块3：图鉴 -->
  <div id="book" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">图鉴</h2>
      <p class="text-slate-400 mb-4">已抽到正常显示，未抽到为正面卡面叠加65%黑色遮罩</p>
      <div class="mb-6">
        <h3 class="text-lg text-pink-400 mb-3">普通小卡</h3>
        <div id="cardBook"></div>
      </div>
      <div>
        <h3 class="text-lg text-amber-400 mb-3">撕拉片</h3>
        <div id="tearBook"></div>
      </div>
    </div>
  </div>

  <!-- 板块4：记录 -->
  <div id="log" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽取记录</h2>
      <button id="clearLog" class="px-4 py-1 bg-red-500 rounded text-sm mb-4">清空记录</button>
      <div id="logList" class="space-y-2 max-h-[600px] overflow-y-auto pr-2 text-sm">
        <div class="text-slate-400">暂无记录</div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 卡牌配置区 ==========
const cardList = [
  {id:"c1", name:"小卡A", series:"星梦系列", backUrl:"https://picsum.photos/id/20/200/300", img:"https://picsum.photos/id/101/200/300"},
  {id:"c2", name:"小卡B", series:"星梦系列", backUrl:"https://picsum.photos/id/20/200/300", img:"https://picsum.photos/id/102/200/300"},
  {id:"c3", name:"小卡C", series:"回响系列", backUrl:"https://picsum.photos/id/21/200/300", img:"https://picsum.photos/id/103/200/300"},
  {id:"c4", name:"小卡D", series:"回响系列", backUrl:"https://picsum.photos/id/21/200/300", img:"https://picsum.photos/id/104/200/300"},
];
const polaroidList = [
  {id:"p1", name:"撕拉A", series:"晨光系列", backUrl:"https://picsum.photos/id/30/200/300", img:"https://picsum.photos/id/111/200/300"},
  {id:"p2", name:"撕拉B", series:"晨光系列", backUrl:"https://picsum.photos/id/30/200/300", img:"https://picsum.photos/id/112/200/300"},
  {id:"p3", name:"撕拉C", series:"暮色系列", backUrl:"https://picsum.photos/id/31/200/300", img:"https://picsum.photos/id/113/200/300"},
];

// 存档读写函数
function saveData(){
  localStorage.setItem("cardSave", JSON.stringify({
    gotCards: Array.from(gotCards),
    gotTears: Array.from(gotTears),
    logArr: logArr
  }));
}
function loadData(){
  const raw = localStorage.getItem("cardSave");
  if(!raw) return;
  const data = JSON.parse(raw);
  gotCards = new Set(data.gotCards || []);
  gotTears = new Set(data.gotTears || []);
  logArr = data.logArr || [];
}
function resetAllSave(){
  localStorage.removeItem("cardSave");
  gotCards.clear();
  gotTears.clear();
  logArr = [];
  renderBook();
  renderLog();
  alert("存档已全部重置！");
}

let gotCards = new Set();
let gotTears = new Set();
let logArr = [];
loadData(); // 页面加载读取存档

// 标签切换
const tabBtns = document.querySelectorAll(".tab-btn");
const tabs = document.querySelectorAll(".tab-content");
tabBtns.forEach(btn=>{
  btn.onclick = ()=>{
    const target = btn.dataset.tab;
    tabBtns.forEach(b=>b.className="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600");
    btn.className="tab-btn px-4 py-2 rounded bg-sky-600";
    tabs.forEach(t=>t.classList.remove("active"));
    document.getElementById(target).classList.add("active");
    if(target==="book") renderBook();
    if(target==="log") renderLog();
  }
})
document.getElementById("resetSaveBtn").onclick = resetAllSave;

// 抽卡工具
function drawOneCard(){
  return cardList[Math.floor(Math.random()*cardList.length)];
}
function drawOneTear(){
  return polaroidList[Math.floor(Math.random()*polaroidList.length)];
}

// 普通小卡 单抽
const drawBtn = document.getElementById("drawBtn");
const drawResult = document.getElementById("drawResult");

drawBtn.onclick = ()=>{
  const rand = drawOneCard();
  gotCards.add(rand.id);
  addLog("普通抽卡【单抽】", `[${rand.series}] ${rand.name}`);
  saveData();

  drawResult.innerHTML = `
    <div class="card-slot">
      <div class="card-img-wrap">
        <div class="card-back absolute inset-0">
          <img src="${rand.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="card-front absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none">
          <img src="${rand.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="card-name">${rand.name}</p>
    </div>
  `;

  const back = drawResult.querySelector(".card-back");
  const front = drawResult.querySelector(".card-front");
  const name = drawResult.querySelector(".card-name");

  setTimeout(() => back.classList.add("back-fade-out"), 100);
  setTimeout(() => {
    back.style.display = "none";
    front.classList.remove("opacity-0", "pointer-events-none");
    front.classList.add("card-pop");
  }, 600);
  setTimeout(() => {
    name.classList.add("name-fade");
  }, 1050);
}

// 普通小卡 5连抽
const draw5Btn = document.getElementById("draw5Btn");
draw5Btn.onclick = ()=>{
  const resultCards = [];
  for(let i = 0; i < 5; i++){
    const c = drawOneCard();
    resultCards.push(c);
    gotCards.add(c.id);
  }
  addLog("普通抽卡【5连抽】", resultCards.map(x=>`[${x.series}]${x.name}`).join("、"));
  saveData();
  drawResult.innerHTML = "";
  resultCards.forEach((card, idx) => {
    const slot = document.createElement("div");
    slot.className = "card-slot";
    slot.innerHTML = `
      <div class="card-img-wrap">
        <div class="card-back absolute inset-0">
          <img src="${card.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="card-front absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none">
          <img src="${card.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="card-name">${card.name}</p>
    `;
    drawResult.appendChild(slot);
    const back = slot.querySelector(".card-back");
    const front = slot.querySelector(".card-front");
    const name = slot.querySelector(".card-name");
    const delay = idx * 180;
    setTimeout(() => back.classList.add("back-fade-out"), 100 + delay);
    setTimeout(() => {
      back.style.display = "none";
      front.classList.remove("opacity-0", "pointer-events-none");
      front.classList.add("card-pop");
    }, 600 + delay);
    setTimeout(() => {
      name.classList.add("name-fade");
    }, 1050 + delay);
  });
}

// 撕拉片 单抽
const tearBtn = document.getElementById("tearBtn");
const tearResult = document.getElementById("tearResult");
tearBtn.onclick = ()=>{
  const rand = drawOneTear();
  gotTears.add(rand.id);
  addLog("撕拉片抽卡【单抽】", `[${rand.series}] ${rand.name}`);
  saveData();
  tearResult.innerHTML = `
    <div class="tear-slot">
      <div class="tear-img-wrap">
        <div class="tear-back absolute inset-0">
          <img src="${rand.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="tear-front absolute inset-0 flex flex-col items-center justify-center opacity-0">
          <img src="${rand.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="tear-name">${rand.name}</p>
    </div>
  `;
  const back = tearResult.querySelector(".tear-back");
  const front = tearResult.querySelector(".tear-front");
  const name = tearResult.querySelector(".tear-name");
  setTimeout(() => back.classList.add("tear-back-fade"), 100);
  setTimeout(() => {
    back.style.display = "none";
    front.classList.remove("opacity-0");
    front.classList.add("tear-front-in");
  }, 800);
  setTimeout(() => {
    name.classList.add("name-fade");
  }, 1200);
}

// 撕拉片 5连抽
const tear5Btn = document.getElementById("tear5Btn");
tear5Btn.onclick = ()=>{
  const resultTears = [];
  for(let i = 0; i < 5; i++){
    const t = drawOneTear();
    resultTears.push(t);
    gotTears.add(t.id);
  }
  addLog("撕拉片抽卡【5连抽】", resultTears.map(x=>`[${x.series}]${x.name}`).join("、"));
  saveData();
  tearResult.innerHTML = "";
  resultTears.forEach((tear, idx) => {
    const slot = document.createElement("div");
    slot.className = "tear-slot";
    slot.innerHTML = `
      <div class="tear-img-wrap">
        <div class="tear-back absolute inset-0">
          <img src="${tear.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="tear-front absolute inset-0 flex flex-col items-center justify-center opacity-0">
          <img src="${tear.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="tear-name">${tear.name}</p>
    `;
    tearResult.appendChild(slot);
    const back = slot.querySelector(".tear-back");
    const front = slot.querySelector(".tear-front");
    const name = slot.querySelector(".tear-name");
    const delay = idx * 180;
    setTimeout(() => back.classList.add("tear-back-fade"), 100 + delay);
    setTimeout(() => {
      back.style.display = "none";
      front.classList.remove("opacity-0");
      front.classList.add("tear-front-in");
    }, 800 + delay);
    setTimeout(() => {
      name.classList.add("name-fade");
    }, 1200 + delay);
  });
}

// 图鉴渲染
function renderBook(){
  const cardBookDom = document.getElementById("cardBook");
  cardBookDom.innerHTML = "";
  const cardGroup = {};
  cardList.forEach(c=>{
    if(!cardGroup[c.series]) cardGroup[c.series] = [];
    cardGroup[c.series].push(c);
  })
  for(const sName in cardGroup){
    const list = cardGroup[sName];
    const total = list.length;
    const collected = list.filter(item=>gotCards.has(item.id)).length;
    const percent = (collected / total) * 100;
    cardBookDom.innerHTML += `
      <div class="series-group">
        <h4 class="series-title">${sName}</h4>
        <div class="progress-text">收集：${collected}/${total}</div>
        <div class="progress-wrap">
          <div class="progress-bar" style="width:${percent}%"></div>
        </div>
        <div class="series-card-grid">`;
    list.forEach(card=>{
      const have = gotCards.has(card.id);
      const htmlMask = have ? "" : `<div class="mask-65"></div>`;
      cardBookDom.innerHTML += `
        <div class="book-card-wrap text-center">
          <img src="${card.img}">
          ${htmlMask}
          <p class="text-xs mt-1">${card.name}</p>
        </div>
      `
    })
    cardBookDom.innerHTML += `</div></div>`;
  }

  const tearBookDom = document.getElementById("tearBook");
  tearBookDom.innerHTML = "";
  const tearGroup = {};
  polaroidList.forEach(t=>{
    if(!tearGroup[t.series]) tearGroup[t.series] = [];
    tearGroup[t.series].push(t);
  })
  for(const sName in tearGroup){
    const list = tearGroup[sName];
    const total = list.length;
    const collected = list.filter(item=>gotTears.has(item.id)).length;
    const percent = (collected / total) * 100;
    tearBookDom.innerHTML += `
      <div class="series-group">
        <h4 class="series-title series-title-tear">${sName}</h4>
        <div class="progress-text">收集：${collected}/${total}</div>
        <div class="progress-wrap">
          <div class="progress-bar" style="width:${percent}%; background-color:#fbbf24;"></div>
        </div>
        <div class="series-card-grid">`;
    list.forEach(card=>{
      const have = gotTears.has(card.id);
      const htmlMask = have ? "" : `<div class="mask-65"></div>`;
      tearBookDom.innerHTML += `
        <div class="book-card-wrap text-center">
          <img src="${card.img}">
          ${htmlMask}
          <p class="text-xs mt-1">${card.name}</p>
        </div>
      `
    })
    tearBookDom.innerHTML += `</div></div>`;
  }
}

// 记录
function addLog(type, name){
  const time = new Date().toLocaleString();
  logArr.unshift({time, type, name});
  renderLog();
}
function renderLog(){
  const logDom = document.getElementById("logList");
  if(logArr.length === 0){
    logDom.innerHTML = `<div class="text-slate-400">暂无记录</div>`;
    return;
  }
  logDom.innerHTML = logArr.map(item=>`
    <div class="bg-slate-700 p-2 rounded">
      <span class="text-slate-400">${item.time}</span>
      <span class="mx-2">｜</span>
      <span>${item.type}</span>
      <span class="mx-2">→</span>
      <span class="text-pink-300">${item.name}</span>
    </div>
  `).join("");
}
document.getElementById("clearLog").onclick = ()=>{
  logArr = [];
  saveData();
  renderLog();
}

// 初始渲染图鉴
renderBook();
</script>
</body>
</html>
