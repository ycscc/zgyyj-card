<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>中国音乐剧小卡抽卡机</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* 卡背淡出 */
@keyframes backFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
.back-fade-out {
  animation: backFadeOut 0.5s ease forwards;
}

/* 正面小卡弹出 */
@keyframes cardPop {
  0% {
    opacity: 0;
    transform: scale(0.7);
  }
  60% {
    opacity: 1;
    transform: scale(1.05);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
.card-pop {
  animation: cardPop 0.45s ease forwards;
}

/* 名称淡入 */
@keyframes nameFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.name-fade {
  animation: nameFade 0.35s ease forwards;
}

/* 撕拉片卡背：左上到右下扫开消失 */
@keyframes tearBackFade {
  0% {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  100% {
    clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  }
}
.tear-back-fade {
  animation: tearBackFade 0.8s ease forwards;
}

/* 撕拉片正面淡入 */
@keyframes tearFrontIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.tear-front-in {
  animation: tearFrontIn 0.4s ease forwards;
  animation-delay: 0.8s;
}

.tab-content { display: none; }
.tab-content.active { display: block; }
.card-item { transition: all 0.3s; }

/* 固定结果区尺寸，避免遮挡按钮 */
.draw-result-box {
  min-height: 380px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  padding: 8px 0;
}

.tear-result-box {
  min-height: 400px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  padding: 8px 0;
}

/* 卡片容器：图片在上，名字在下方独立区域 */
.card-slot {
  width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card-img-wrap {
  width: 160px;
  height: 240px;
  position: relative;
}
.card-name {
  margin-top: 8px;
  text-align: center;
  font-size: 0.875rem;
  opacity: 0;
}

.tear-slot {
  width: 192px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.tear-img-wrap {
  width: 192px;
  height: 288px;
  position: relative;
  overflow:hidden;
}
.tear-name {
  margin-top: 8px;
  text-align: center;
  font-size: 0.875rem;
  opacity: 0;
}

.series-group {
  margin-bottom: 20px;
}
.series-title{
  width:100%;
  color:#f472b6;
  font-weight:bold;
  margin:12px 0 4px;
}
.series-title-tear{
  color:#fbbf24;
}
.progress-wrap{
  width:100%;
  height:10px;
  background-color:#334155;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:8px;
}
.progress-bar{
  height:100%;
  background-color:#f472b6;
  transition: width 0.3s ease;
}
.progress-bar-tear{
  background-color:#fbbf24;
}
.progress-text{
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:6px;
}

/* 图鉴卡片容器 + 遮罩 */
.book-card-wrap{
  position:relative;
  width:100%;
  aspect-ratio: 2 / 3;
  overflow:hidden;
  border-radius:0.5rem;
  min-width:0;
}
.book-card-wrap img{
  width:100%;
  height:100%;
  object-fit: cover;
  display:block;
  min-width:0;
  min-height:0;
  max-width:100%;
  max-height:100%;
}
.mask-65{
  position:absolute;
  inset:0;
  background-color:rgba(0,0,0,0.65);
  border-radius:0.5rem;
  z-index:1;
}
.book-card-wrap.got{
  cursor:pointer;
}
.book-card-wrap.got:hover img{
  filter: brightness(1.1);
}
.book-card-name{
  text-align:center;
  font-size:0.75rem;
  margin-top:4px;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.book-card-count{
  text-align:center;
  font-size:0.65rem;
  color:#94a3b8;
  margin-top:2px;
}

/* 大图弹窗 */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lightbox.active {
  display: flex;
}
.lightbox-img {
  max-width: 90%;
  max-height: 90vh;
  border-radius: 0.5rem;
}
.lightbox-close {
  position: absolute;
  top: 16px;
  right: 24px;
  color: white;
  font-size: 32px;
  cursor: pointer;
}
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl md:text-3xl font-bold text-center mb-2">小卡抽卡模拟器</h1>

  <!-- ✅ 新增：总抽卡统计栏 -->
  <div id="totalDrawBox" class="text-center mb-6 bg-slate-800 rounded-lg py-3 px-4">
    <span class="text-slate-300">普通小卡总抽：</span>
    <span id="totalCardDraw" class="text-pink-400 font-bold">0</span>
    <span class="mx-3">｜</span>
    <span class="text-slate-300">撕拉片总抽：</span>
    <span id="totalTearDraw" class="text-amber-400 font-bold">0</span>
    <span class="mx-3">｜</span>
    <span class="text-slate-300">全部合计：</span>
    <span id="totalAllDraw" class="text-sky-400 font-bold">0</span>
  </div>

  <!-- 导航标签 -->
  <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-700 pb-2">
    <button class="tab-btn px-4 py-2 rounded bg-sky-600" data-tab="draw">抽卡</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="tear">抽撕拉片</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="book">图鉴</button>
    <button class="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600" data-tab="log">记录</button>
    <button id="resetSaveBtn" class="px-4 py-2 rounded bg-red-700 hover:bg-red-600">重置存档</button>
  </div>

  <!-- 板块1：抽卡 -->
  <div id="draw" class="tab-content active">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽卡</h2>
      <p class="text-slate-400 mb-4">请抽取你的小卡</p>
      <div class="flex gap-3 mb-4">
        <button id="drawBtn" class="px-6 py-2 bg-pink-500 rounded-lg hover:bg-pink-600">单抽一张</button>
        <button id="draw5Btn" class="px-6 py-2 bg-rose-600 rounded-lg hover:bg-rose-700">5连抽</button>
      </div>
      <div id="drawResult" class="draw-result-box">
        <div class="text-slate-500 text-sm self-center">点击按钮开始抽卡</div>
      </div>
    </div>
  </div>

  <!-- 板块2：抽撕拉片 -->
  <div id="tear" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽撕拉片</h2>
      <p class="text-slate-400 mb-4">请抽取你的撕拉片</p>
      <div class="flex gap-3 mb-4">
        <button id="tearBtn" class="px-6 py-2 bg-amber-500 rounded-lg hover:bg-amber-600">单抽一张</button>
        <button id="tear5Btn" class="px-6 py-2 bg-orange-600 rounded-lg hover:bg-orange-700">5连抽</button>
      </div>
      <div id="tearResult" class="tear-result-box">
        <div class="text-slate-500 text-sm self-center">点击按钮开始抽取撕拉片</div>
      </div>
    </div>
  </div>

  <!-- 板块3：图鉴（分系列展示） -->
  <div id="book" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">图鉴</h2>
      <p class="text-slate-400 mb-4">已抽到卡片可点击放大；未抽到卡面不可点击</p>
      <div class="mb-6">
        <h3 class="text-lg text-pink-400">普通小卡</h3>
        <div id="cardBook" class="grid grid-cols-3 md:grid-cols-5 gap-4 mt-2"></div>
      </div>
      <div>
        <h3 class="text-lg text-amber-400">撕拉片</h3>
        <div id="tearBook" class="grid grid-cols-3 md:grid-cols-5 gap-4 mt-2"></div>
      </div>
    </div>
  </div>

  <!-- 板块4：记录 -->
  <div id="log" class="tab-content">
    <div class="bg-slate-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">抽取记录</h2>
      <button id="clearLog" class="px-4 py-1 bg-red-500 rounded text-sm mb-4">清空记录</button>
      <div id="logList" class="space-y-2 max-h-[600px] overflow-y-auto pr-2 text-sm">
        <div class="text-slate-400">暂无记录</div>
      </div>
    </div>
  </div>
</div>

<!-- 大图弹窗 -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightboxClose">×</span>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
</div>

<script>
// ========== 配置区：新增 series、backUrl，每个系列独立卡背 ==========
const cardList = [
  {id:"c1", name:"小卡A", series:"星梦系列", backUrl:"https://picsum.photos/id/20/200/300", img:"https://picsum.photos/id/101/200/300"},
  {id:"c2", name:"小卡B", series:"星梦系列", backUrl:"https://picsum.photos/id/20/200/300", img:"https://picsum.photos/id/102/200/300"},
  {id:"c3", name:"小卡C", series:"回响系列", backUrl:"https://picsum.photos/id/21/200/300", img:"https://picsum.photos/id/103/200/300"},
  {id:"c4", name:"小卡D", series:"回响系列", backUrl:"https://picsum.photos/id/21/200/300", img:"https://picsum.photos/id/104/200/300"},
];
const polaroidList = [
  {id:"p1", name:"徐杭", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/qYFdSN5p/You3.jpg"},
  {id:"p2", name:"邱俊阳", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/sp7m8ZHb/You2.jpg"},
  {id:"p3", name:"毛二", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/TMR8pXsc/You1.jpg"},
  {id:"p4", name:"郑艺彬", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/5ggxhSbv/Wang2.jpg"},
  {id:"p5", name:"王敏辉", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/TGwLzCY/Wang1.jpg"},
  {id:"p6", name:"陈蕴", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/pvSY0wWq/Other2.jpg"},
  {id:"p7", name:"叶宇锋", series:"Badkids", backUrl:"https://i.ibb.co/TqWp1xn5/card-back.jpg", img:"https://i.ibb.co/Dgpy21PB/Other1.jpg"},

];

let gotCards = new Set();
let gotTears = new Set();
let cardCount = {};   // 普通小卡抽中次数
let tearCount = {};   // 撕拉片抽中次数
let logArr = [];
// ✅ 新增总抽数变量
let totalCardDraw = 0;
let totalTearDraw = 0;

// ✅ 更新顶部统计文字函数
function updateTotalDrawUI(){
  document.getElementById("totalCardDraw").textContent = totalCardDraw;
  document.getElementById("totalTearDraw").textContent = totalTearDraw;
  document.getElementById("totalAllDraw").textContent = totalCardDraw + totalTearDraw;
}

// ===== localStorage 存档读写 =====
function saveData(){
  localStorage.setItem("cardSaveData", JSON.stringify({
    gotCards: Array.from(gotCards),
    gotTears: Array.from(gotTears),
    cardCount: cardCount,
    tearCount: tearCount,
    logArr: logArr,
    totalCardDraw: totalCardDraw,
    totalTearDraw: totalTearDraw
  }));
}
function loadData(){
  const raw = localStorage.getItem("cardSaveData");
  if(!raw) return;
  const data = JSON.parse(raw);
  gotCards = new Set(data.gotCards || []);
  gotTears = new Set(data.gotTears || []);
  cardCount = data.cardCount || {};
  tearCount = data.tearCount || {};
  logArr = data.logArr || [];
  totalCardDraw = data.totalCardDraw || 0;
  totalTearDraw = data.totalTearDraw || 0;
  updateTotalDrawUI();
}
function resetAllSave(){
  localStorage.removeItem("cardSaveData");
  gotCards.clear();
  gotTears.clear();
  cardCount = {};
  tearCount = {};
  logArr = [];
  totalCardDraw = 0;
  totalTearDraw = 0;
  updateTotalDrawUI();
  renderBook();
  renderLog();
  alert("存档已重置！");
}
loadData();

// 标签切换
const tabBtns = document.querySelectorAll(".tab-btn");
const tabs = document.querySelectorAll(".tab-content");
tabBtns.forEach(btn=>{
  btn.onclick = ()=>{
    const target = btn.dataset.tab;
    tabBtns.forEach(b=>b.className="tab-btn px-4 py-2 rounded bg-slate-700 hover:bg-slate-600");
    btn.className="tab-btn px-4 py-2 rounded bg-sky-600";
    tabs.forEach(t=>t.classList.remove("active"));
    document.getElementById(target).classList.add("active");
    if(target==="book") renderBook();
    if(target==="log") renderLog();
  }
})
document.getElementById("resetSaveBtn").onclick = resetAllSave;

// 工具函数
function drawOneCard(){
  return cardList[Math.floor(Math.random()*cardList.length)];
}
function drawOneTear(){
  return polaroidList[Math.floor(Math.random()*polaroidList.length)];
}

// 普通抽卡：单抽
const drawBtn = document.getElementById("drawBtn");
const drawResult = document.getElementById("drawResult");

drawBtn.onclick = ()=>{
  const rand = drawOneCard();
  gotCards.add(rand.id);
  cardCount[rand.id] = (cardCount[rand.id] || 0) + 1;
  totalCardDraw += 1; // ✅ 统计+1
  addLog("普通抽卡【单抽】", `[${rand.series}] ${rand.name}`);
  saveData();
  updateTotalDrawUI();

  drawResult.innerHTML = `
    <div class="card-slot">
      <div class="card-img-wrap">
        <div class="card-back absolute inset-0">
          <img src="${rand.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="card-front absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none">
          <img src="${rand.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="card-name">${rand.name}</p>
    </div>
  `;

  const back = drawResult.querySelector(".card-back");
  const front = drawResult.querySelector(".card-front");
  const name = drawResult.querySelector(".card-name");

  setTimeout(() => back.classList.add("back-fade-out"), 100);

  setTimeout(() => {
    back.style.display = "none";
    front.classList.remove("opacity-0", "pointer-events-none");
    front.classList.add("card-pop");
  }, 600);

  setTimeout(() => {
    name.classList.add("name-fade");
  }, 1050);
}

// 普通抽卡：5连抽
const draw5Btn = document.getElementById("draw5Btn");

draw5Btn.onclick = ()=>{
  const resultCards = [];
  for(let i = 0; i < 5; i++){
    const c = drawOneCard();
    resultCards.push(c);
    gotCards.add(c.id);
    cardCount[c.id] = (cardCount[c.id] || 0) + 1;
  }
  totalCardDraw += 5; // ✅ 5连直接+5
  addLog("普通抽卡【5连抽】", resultCards.map(x=>`[${x.series}]${x.name}`).join("、"));
  saveData();
  updateTotalDrawUI();

  drawResult.innerHTML = "";

  resultCards.forEach((card, idx) => {
    const slot = document.createElement("div");
    slot.className = "card-slot";
    slot.innerHTML = `
      <div class="card-img-wrap">
        <div class="card-back absolute inset-0">
          <img src="${card.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="card-front absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none">
          <img src="${card.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="card-name">${card.name}</p>
    `;
    drawResult.appendChild(slot);

    const back = slot.querySelector(".card-back");
    const front = slot.querySelector(".card-front");
    const name = slot.querySelector(".card-name");

    const delay = idx * 180;

    setTimeout(() => back.classList.add("back-fade-out"), 100 + delay);

    setTimeout(() => {
      back.style.display = "none";
      front.classList.remove("opacity-0", "pointer-events-none");
      front.classList.add("card-pop");
    }, 600 + delay);

    setTimeout(() => {
      name.classList.add("name-fade");
    }, 1050 + delay);
  });
}

// 撕拉片：单抽
const tearBtn = document.getElementById("tearBtn");
const tearResult = document.getElementById("tearResult");

tearBtn.onclick = ()=>{
  const rand = drawOneTear();
  gotTears.add(rand.id);
  tearCount[rand.id] = (tearCount[rand.id] || 0) + 1;
  totalTearDraw += 1; // ✅ 撕拉单抽+1
  addLog("撕拉片抽卡【单抽】", `[${rand.series}] ${rand.name}`);
  saveData();
  updateTotalDrawUI();

  tearResult.innerHTML = `
    <div class="tear-slot">
      <div class="tear-img-wrap">
        <div class="tear-back absolute inset-0">
          <img src="${rand.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="tear-front absolute inset-0 flex flex-col items-center justify-center opacity-0">
          <img src="${rand.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="tear-name">${rand.name}</p>
    </div>
  `;

  const back = tearResult.querySelector(".tear-back");
  const front = tearResult.querySelector(".tear-front");
  const name = tearResult.querySelector(".tear-name");

  setTimeout(() => back.classList.add("tear-back-fade"), 100);

  setTimeout(() => {
    back.style.display = "none";
    front.classList.remove("opacity-0");
    front.classList.add("tear-front-in");
  }, 800);

  setTimeout(() => {
    name.classList.add("name-fade");
  }, 1200);
}

// 撕拉片：5连抽
const tear5Btn = document.getElementById("tear5Btn");
tear5Btn.onclick = ()=>{
  const resultTears = [];
  for(let i = 0; i < 5; i++){
    const t = drawOneTear();
    resultTears.push(t);
    gotTears.add(t.id);
    tearCount[t.id] = (tearCount[t.id] || 0) + 1;
  }
  totalTearDraw += 5; // ✅ 撕拉5连+5
  addLog("撕拉片抽卡【5连抽】", resultTears.map(x=>`[${x.series}]${x.name}`).join("、"));
  saveData();
  updateTotalDrawUI();

  tearResult.innerHTML = "";

  resultTears.forEach((tear, idx) => {
    const slot = document.createElement("div");
    slot.className = "tear-slot";
    slot.innerHTML = `
      <div class="tear-img-wrap">
        <div class="tear-back absolute inset-0">
          <img src="${tear.backUrl}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
        <div class="tear-front absolute inset-0 flex flex-col items-center justify-center opacity-0">
          <img src="${tear.img}" class="w-full h-full object-cover rounded-lg shadow-lg">
        </div>
      </div>
      <p class="tear-name">${tear.name}</p>
    `;
    tearResult.appendChild(slot);

    const back = slot.querySelector(".tear-back");
    const front = slot.querySelector(".tear-front");
    const name = slot.querySelector(".tear-name");

    const delay = idx * 180;

    setTimeout(() => back.classList.add("tear-back-fade"), 100 + delay);

    setTimeout(() => {
      back.style.display = "none";
      front.classList.remove("opacity-0");
      front.classList.add("tear-front-in");
    }, 800 + delay);

    setTimeout(() => {
      name.classList.add("name-fade");
    }, 1200 + delay);
  });
}

// 图鉴：分组渲染（按系列 + 进度条 + 遮罩 + 抽中次数）
function renderBook(){
  const cardBookDom = document.getElementById("cardBook");
  cardBookDom.innerHTML = "";
  // 普通小卡分组
  const cardGroup = {};
  cardList.forEach(c=>{
    if(!cardGroup[c.series]) cardGroup[c.series] = [];
    cardGroup[c.series].push(c);
  })
  for(const sName in cardGroup){
    const list = cardGroup[sName];
    const total = list.length;
    const collected = list.filter(item=>gotCards.has(item.id)).length;
    const percent = (collected / total) * 100;
    cardBookDom.innerHTML += `
      <div class="series-group">
        <div class="series-title">${sName}</div>
        <div class="progress-text">收集：${collected}/${total}</div>
        <div class="progress-wrap">
          <div class="progress-bar" style="width:${percent}%"></div>
        </div>
        <div class="grid grid-cols-3 md:grid-cols-5 gap-4">`;
    list.forEach(card=>{
      const have = gotCards.has(card.id);
      const maskHtml = have ? "" : `<div class="mask-65"></div>`;
      const clickClass = have ? "got" : "";
      const dataImg = have ? `data-img="${card.img}"` : "";
      const cnt = cardCount[card.id] || 0;
      cardBookDom.innerHTML += `
        <div>
          <div class="book-card-wrap ${clickClass}" ${dataImg}>
            <img src="${card.img}">
            ${maskHtml}
          </div>
          <p class="book-card-name">${card.name}</p>
          <p class="book-card-count">已抽中 ${cnt} 次</p>
        </div>
      `
    })
    cardBookDom.innerHTML += `</div></div>`;
  }

  // 撕拉片分组
  const tearBookDom = document.getElementById("tearBook");
  tearBookDom.innerHTML = "";
  const tearGroup = {};
  polaroidList.forEach(t=>{
    if(!tearGroup[t.series]) tearGroup[t.series] = [];
    tearGroup[t.series].push(t);
  })
  for(const sName in tearGroup){
    const list = tearGroup[sName];
    const total = list.length;
    const collected = list.filter(item=>gotTears.has(item.id)).length;
    const percent = (collected / total) * 100;
    tearBookDom.innerHTML += `
      <div class="series-group">
        <div class="series-title series-title-tear">${sName}</div>
        <div class="progress-text">收集：${collected}/${total}</div>
        <div class="progress-wrap">
          <div class="progress-bar progress-bar-tear" style="width:${percent}%"></div>
        </div>
        <div class="grid grid-cols-3 md:grid-cols-5 gap-4">`;
    list.forEach(card=>{
      const have = gotTears.has(card.id);
      const maskHtml = have ? "" : `<div class="mask-65"></div>`;
      const clickClass = have ? "got" : "";
      const dataImg = have ? `data-img="${card.img}"` : "";
      const cnt = tearCount[card.id] || 0;
      tearBookDom.innerHTML += `
        <div>
          <div class="book-card-wrap ${clickClass}" ${dataImg}>
            <img src="${card.img}">
            ${maskHtml}
          </div>
          <p class="book-card-name">${card.name}</p>
          <p class="book-card-count">已抽中 ${cnt} 次</p>
        </div>
      `
    })
    tearBookDom.innerHTML += `</div></div>`;
  }

  // 绑定大图点击
  document.querySelectorAll(".book-card-wrap.got").forEach(el=>{
    el.onclick = ()=>{
      openLightbox(el.dataset.img);
    }
  })
}

// 弹窗逻辑
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxClose = document.getElementById("lightboxClose");
function openLightbox(url){
  lightboxImg.src = url;
  lightbox.classList.add("active");
}
function closeLightbox(){
  lightbox.classList.remove("active");
}
lightboxClose.onclick = closeLightbox;
lightbox.onclick = (e)=>{
  if(e.target === lightbox) closeLightbox();
}

// 记录
function addLog(type, name){
  const time = new Date().toLocaleString();
  logArr.unshift({time, type, name});
  renderLog();
}
function renderLog(){
  const logDom = document.getElementById("logList");
  if(logArr.length === 0){
    logDom.innerHTML = `<div class="text-slate-400">暂无记录</div>`;
    return;
  }
  logDom.innerHTML = logArr.map(item=>`
    <div class="bg-slate-700 p-2 rounded">
      <span class="text-slate-400">${item.time}</span>
      <span class="mx-2">｜</span>
      <span>${item.type}</span>
      <span class="mx-2">→</span>
      <span class="text-pink-300">${item.name}</span>
    </div>
  `).join("");
}
document.getElementById("clearLog").onclick = ()=>{
  logArr = [];
  saveData();
  renderLog();
}

// 初始渲染图鉴
renderBook();
</script>
